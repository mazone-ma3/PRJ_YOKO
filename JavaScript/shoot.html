<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シンプル横スクロールシューティング</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            border: 0px solid #0ff;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 1px;
            left: 10px;
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 5px #0ff;
        }
        #start-screen {
            position: absolute;
            top: 0%;
            left: 0%;
            transform: translate(0%, 0%);
            color: #fff;
            text-align: center;
            font-size: 16px;
            text-shadow: 0 0 10px #0ff;
        }
    </style>
</head>
<body>
    <canvas id="game" width="512" height="384"></canvas>
    <div id="ui">SCORE: <span id="score">0</span>　LIFE: <span id="life">3</span></div>
    <div id="start-screen">
        <h4>横スクロールシューティング</h4>
        <p>←↑↓→ または WASD で移動</p>
        <p>スペース で射撃</p>
        <button id="button1">フルスクリーン表示</button>
        <button id="button2">解除</button>
    </div>
    <img id="yokosht" src="yokosht.png" style="display: none">
    <img id="fontyoko" src="fontyoko.png" style="display: none">

    <script src=shoot.js async>

    </script>
</body>
</html>

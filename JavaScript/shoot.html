<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シンプル横スクロールシューティング</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            border: 0px solid #0ff;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 1px;
            left: 10px;
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 5px #0ff;
        }
        #start-screen {
            position: absolute;
            top: 0%;
            left: 0%;
            transform: translate(0%, 0%);
            color: #fff;
            text-align: center;
            font-size: 16px;
            text-shadow: 0 0 10px #0ff;
        }
    </style>
</head>
<body>
    <canvas id="game" width="512" height="384"></canvas>
    <div id="ui">SCORE: <span id="score">0</span>　LIFE: <span id="life">3</span></div>
    <div id="start-screen">
        <h4>横スクロールシューティング</h4>
        <p>←↑↓→ または WASD で移動</p>
        <p>スペース で射撃</p>
        <button id="button1">フルスクリーン表示</button>
        <button id="button2">解除</button>
    </div>
    <img id="yokosht" src="yokosht.png" style="display: none">
    <img id="fontyoko" src="fontyoko.png" style="display: none">

    <script>

    function setfullscreen() {

        // Chrome & Firefox v64以降
        if( canvas.requestFullscreen ) {
                 canvas.requestFullscreen();
          
        // Firefox v63以前
        } else if( canvas.mozRequestFullScreen ) {
          canvas.mozRequestFullScreen();

        // Safari & Edge & Chrome v68以前
        } else if( canvas.webkitRequestFullscreen ) {
          canvas.webkitRequestFullscreen();
          
        // IE11
        } else if( canvas.msRequestFullscreen ) {
          canvas.msRequestFullscreen();
        }        

    }

    window.addEventListener('load', function(){

      // フルスクリーン表示
      document.getElementById('button1').addEventListener('click', function(){

           setfullscreen();

      });

      // フルスクリーン解除
      document.getElementById('button2').addEventListener('click', function(){
        
        // Chrome & Firefox v64以降
        if( document.exitFullscreen ) {
          document.exitFullscreen();

        // Firefox v63以前
        } else if( document.mozCancelFullScreen ) {
          document.mozCancelFullScreen();

        // Safari & Edge & Chrome v44以前
        } else if( document.webkitCancelFullScreen ) {
          document.webkitCancelFullScreen();

        // IE11
        } else if( document.msExitFullscreen ) {
          document.msExitFullscreen();
        }
      });
    });

        const FONT_SIZE = 16;
        const COUNT1S = 60;

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const lifeEl = document.getElementById('life');

        const audio = new Audio('bgm.mp3');
        audio.loop = true;
        const wav = new Audio('explosion.wav');

        sourceImage = document.getElementById("yokosht");
        fontImage = document.getElementById("fontyoko");

        let gameRunning = 1;
        let score = 0;
        let high_score = 5000;
        let life = 3;

        let easy_mode = false;
        let bomb_stock = 0;
        let gameTime = 0;
        let chain_count = 0;

        let lastTime = 0;
		let rate = 0;

        // プレイヤー
        const player = {
            x: 60,
            y: 160,
            width: 32,
            height: 20,
            left: 0,
            top: 6,
            speed: 4
        };

        let bullets = [];
        let enemies = [];
        let particles = []; // 爆発エフェクト

        let keys = {};
        let lastShot = 0;

        // 背景星
        let stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 2 + 1
            });
        }

        function put_strings(x, y, text) {
            const len = text.length;
            for (let i = 0; i < len; i++) {
                if (text[i] !== ' ') {
                // 文字コードを取得して '0' の文字コードを引く
                    const pat_no = text.charCodeAt(i) - '0'.charCodeAt(0);
                    ctx.drawImage(fontImage, (pat_no % 16) * 16, Math.floor(pat_no / 16) * 16, 16, 16, x, y,  16, 16);
                }
                x = x + 16;
            }
        }

        function put_strings_num(x, y, str, num, digit) {
            let text = "";
            const len = str.length;
            let i = digit;
            let j = num;

            // 1. 最初の文字列（例: "SCORE: "）を描画
            put_strings(x, y, str);

            // 2. 数値を下1桁から順に文字に変換して、文字列の先頭に結合していく
            while (i > 0) {
                i--;
                // j % 10 で一番右の桁の数値を取得し、文字に変換
                text = String.fromCharCode((j % 10) + '0'.charCodeAt(0)) + text;
                // JavaScriptの除算は浮動小数点になるため、Math.floorで整数化（10で割って1桁削る）
                j = Math.floor(j / 10);
            }

            // 3. 最初の文字列の長さ分だけ右にずらした位置に、変換した数値文字列を描画
            put_strings(x + (len * FONT_SIZE), y, text);
}

        function put_sprite(x, y, pat_no) {
            ctx.drawImage(sourceImage, pat_no * 32, 0, 31, 31, x, y,  31, 31);
        }

        function drawPlayer() {
/*            ctx.fillStyle = '#0f0';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y + player.height/2);
            ctx.lineTo(player.x + player.width, player.y);
            ctx.lineTo(player.x + player.width - 10, player.y + player.height/2);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // コックピット
            ctx.fillStyle = '#ff0';
            ctx.fillRect(player.x + 25, player.y + 12, 8, 6);
*/
//            ctx.drawImage(sourceImage, 32, 0, 32, 32, player.x, player.y, 32, 32);
              put_sprite(player.x, player.y, 1);
        }

        function drawBullet(b) {
/*            ctx.fillStyle = '#ff0';
            ctx.fillRect(b.x, b.y - 3, 20, 6);*/
//            ctx.drawImage(sourceImage, 32*4, 0, 32, 32, b.x, b.y, 32, 32);
              put_sprite(b.x, b.y, 4);
        }

        function drawEnemy(e) {
/*            ctx.fillStyle = '#f44';
            ctx.beginPath();
            ctx.moveTo(e.x + e.width, e.y + e.height/2);
            ctx.lineTo(e.x, e.y);
            ctx.lineTo(e.x + 10, e.y + e.height/2);
            ctx.lineTo(e.x, e.y + e.height);
            ctx.closePath();
            ctx.fill();*/
//            ctx.drawImage(sourceImage, 32*2, 0, 32, 32, e.x, e.y, 32, 32);
              put_sprite(e.x, e.y, 2);
        }

        function update() {
            if (gameRunning) {
                if (keys[' '] || keys['z'])
                    startGame();
                else
                    return;
            }

            timestamp = Date.now();
            deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            gameTime += deltaTime;
            rate = deltaTime * COUNT1S;

            // プレイヤー移動
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed * rate;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed * rate;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed * rate;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed * rate;

            // 画面端制限
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // 自動射撃（連射）
            const now = Date.now();
            if ((keys[' '] || keys['z']) && now - lastShot > 150) {
                bullets.push({
                    x: player.x + player.width,
                    y: player.y + player.height/2,
                    width: 16,
                    height: 8,
                    left: 0,
                    top: 0,
                });
                lastShot = now;
            }

            // 弾更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += 12 * rate;
                if (bullets[i].x > canvas.width) bullets.splice(i, 1);
            }

            // 敵生成
            if (Math.random() < 0.03) {
                enemies.push({
                    x: canvas.width + 50,
                    y: Math.random() * (canvas.height - 40),
                    width: 32,
                    height: 32,
                    left: 0,
                    top: 0,
                    speed: 3 + Math.random() * 2
                });
            }

            // 敵更新
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.x -= e.speed;

                // プレイヤーと衝突
                if (checkCollision(player, e)) {
                    life--;
                    lifeEl.textContent = life;
                    createExplosion(e.x, e.y);
                    enemies.splice(i, 1);

                    if (life <= 0) {
                        gameOver();
                    }
                    continue;
                }

                if (e.x < -50) enemies.splice(i, 1);
            }

            // 衝突判定（弾 vs 敵）
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (checkCollision(b, e)) {
                        score += 100;
                        scoreEl.textContent = score;
                        createExplosion(e.x, e.y);
                        bullets.splice(i, 1);
                        enemies.splice(j, 1);
                        wav.pause();
                        wav.currentTime = 0;
                        wav.play();
                        break;
                    }
                }
            }

            // パーティクル更新
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function checkCollision(a, b) {
/*            if (!b.width) { // 弾の場合
                return (
                    a.x < b.x + 20 &&
                    a.x + (a.width || 40) > b.x &&
                    a.y < b.y + 6 &&
                    a.y + (a.height || 30) > b.y
                );
            }
            return !(
                a.x + (a.width || 40) < b.x ||
                a.x > b.x + b.width ||
                a.y + (a.height || 30) < b.y ||
                a.y > b.y + b.height
            );*/
            return !(
                a.x + a.left + a.width < b.x + b.left ||
                a.x + a.left > b.x + b.left + b.width ||
                a.y + a.top + a.height < b.y + b.top ||
                a.y + a.top > b.y + b.top + b.height
            );        }

        function createExplosion(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x + 20,
                    y: y + 15,
                    vx: Math.random() * 8 - 4,
                    vy: Math.random() * 8 - 4,
                    life: 20 + Math.random() * 20,
                    color: Math.random() > 0.5 ? '#ff0' : '#f80'
                });
            }
        }

        function draw() {
            // 背景
            ctx.fillStyle = '#000011';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 星
            ctx.fillStyle = '#fff';
            for (let star of stars) {
                ctx.globalAlpha = 0.3 + Math.random() * 0.7;
                ctx.fillRect(star.x, star.y, star.size, star.size);
                star.x -= star.speed;
                if (star.x < 0) star.x = canvas.width;
            }
            ctx.globalAlpha = 1;

            // オブジェクト描画
            drawPlayer();

            bullets.forEach(drawBullet);
            enemies.forEach(drawEnemy);

            // パーティクル
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 4, 4);
            }

            ctx.globalAlpha = 1;

//			put_strings(0,0,"0123");

			if (score >= high_score) {
				put_strings_num(0, 0, "HIGH  ", score, 7);
			} else {
				put_strings_num(0, 0, "SCORE ", score, 7);
			}
			if (easy_mode == true) {
				put_strings_num(0, 2*FONT_SIZE, "LIVES ", life, 1);
			}
			put_strings_num(0, 1*FONT_SIZE, "BOMB  ", bomb_stock, 1);

			put_strings_num(16*FONT_SIZE, 0, "COUNT ", Math.floor(gameTime), 7);

			if (chain_count > 0) {
				put_strings_num(16*FONT_SIZE, 1*FONT_SIZE, "CHAIN ", chain_count, 3);
			}

			if (gameRunning != 0) {
				put_strings(11*FONT_SIZE, 12*FONT_SIZE, "GAME OVER");
				put_strings_num(7*FONT_SIZE, 15*FONT_SIZE, "HIGH SCORE ", high_score, 7);

				put_strings(7*FONT_SIZE, 18*FONT_SIZE, "PRESS A TO RESTART");
			}

        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
//            document.getElementById('start-screen').style.display = 'none';
            gameRunning = 0;
            score = 0;
            life = 3;
            scoreEl.textContent = score;
            lifeEl.textContent = life;
            bullets = [];
            enemies = [];
            particles = [];
            player.x = 60;
            player.y = 160;

            easy_mode = false;
            bomb_stock = 0;
            gameTime = 0;
            chain_count = 0;

            lastTime = Date.now();

            audio.play();
        }

        function gameOver() {
            gameRunning = 1;
            audio.pause();         // ① 止める
            audio.currentTime = 0; // ② 頭出し（0秒に戻す）
//            alert(`ゲームオーバー！\n最終スコア: ${score}`);
//            document.getElementById('start-screen').style.display = 'block';
//			startGame();
        }

        // キー入力
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        // ゲーム開始
        gameLoop();
    </script>
</body>
</html>
